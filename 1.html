<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josué Santos 🎺 | Trompetista e Educador</title>

    <!-- SEO básico -->
    <meta name="description" content="Josué Santos — Trompetista, professor alfabetizador e arte educador. Agende uma apresentação ou aula de trompete.">
    <meta name="author" content="Josué Santos">
    <meta name="theme-color" content="#f5f5f7">

    <!-- Open Graph (preview em WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Josué Santos 🎺 | Trompetista e Educador">
    <meta property="og:description" content="Músico, professor e arte educador. Agende uma apresentação ou aula!">
    <!-- EDITE AQUI: coloque o link público da sua foto -->
    <meta property="og:image" content="https://seusite.com/josue.jpeg">
    <meta property="og:url" content="https://seusite.com">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon com emoji de trompete -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>">

    <!-- Fontes e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dourado: #d4af37;
            --texto: #2c2c2c;
            --texto-suave: #3f3f3f;
            --card: rgba(255, 255, 255, 0.85);
            --card-hover: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f5f7 0%, #eef0f3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--texto);
            padding: 20px 0;
            /* pequeno brilho decorativo */
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--texto);
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Foto de perfil com anel dourado */
        .profile-pic-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 14px;
            border: 3px solid var(--dourado);
            padding: 4px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .username {
            font-size: 1rem;
            color: var(--texto-suave);
            margin-bottom: 22px;
        }

        /* CTA principal — Agendar */
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 30px;
            margin-bottom: 25px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
        }

        /* Ícones de redes sociais */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.4rem;
            background: #fff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
        }

        .whatsapp { color: #25d366; }
        .instagram { color: #e1306c; }
        .facebook { color: #1877f2; }
        .email { color: #333; }
        .youtube { color: #ff0000; }

        /* Lista de descrições */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--card);
            border-radius: 30px;
            padding: 14px 20px;
            text-decoration: none;
            color: var(--texto);
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .link-item:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .link-item i {
            font-size: 1.05rem;
            color: var(--dourado);
            width: 20px;
            text-align: center;
        }

        /* Botão compartilhar */
        .share-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1.5px solid #ccc;
            color: var(--texto-suave);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .share-button:hover {
            background: #fff;
            border-color: var(--dourado);
            color: var(--dourado);
        }

        /* Modo escuro automático */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a1d 0%, #232328 100%);
                color: #eee;
            }
            h1 { color: #fff; }
            .username { color: #bbb; }
            .profile-pic-container { background: #2a2a2e; }
            .link-item {
                background: rgba(255,255,255,0.06);
                color: #eee;
            }
            .link-item:hover { background: rgba(255,255,255,0.12); }
            .social-icons a { background: #2a2a2e; }
            .email { color: #eee; }
            .share-button { border-color: #555; color: #ccc; }
            .share-button:hover { background: #2a2a2e; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nome -->
        <h1>JOSUÉ SANTOS 🎺</h1>

        <!-- Foto de perfil -->
        <div class="profile-pic-container">
            <img src="josue.jpeg" alt="Foto de Josué Santos">
        </div>

        <!-- Handle -->
        <div class="username">@josuesantos</div>

        <!-- CTA principal -->
        <!-- EDITE AQUI: ajuste a mensagem pré-preenchida -->
        <a href="https://wa.me/5517991122863?text=Ol%C3%A1%2C%20tudo%20bem%3F%20Gostaria%20de%20conversar%20sobre%20sua%20disponibilidade."
           class="cta-button" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i>
            Fale comigo!
        </a>

        <!-- Redes sociais -->
        <div class="social-icons">
            <a href="https://wa.me/5517991122863" class="whatsapp" title="WhatsApp" aria-label="WhatsApp" target="_blank" rel="noopener">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <!-- EDITE AQUI: link real do Instagram -->
            <a href="https://instagram.com/josuesantos" class="instagram" title="Instagram" aria-label="Instagram" target="_blank" rel="noopener">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <!-- EDITE AQUI: link real do Facebook -->
            <a href="https://facebook.com/josue.tpt" class="facebook" title="Facebook" aria-label="Facebook" target="_blank" rel="noopener">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <!-- EDITE AQUI: se tiver canal no YouTube, descomente abaixo -->
            <!--
            <a href="https://www.youtube.com/@JosueSantoss" class="youtube" title="YouTube" aria-label="YouTube" target="_blank" rel="noopener">
                <i class="fa-brands fa-youtube"></i>
            </a>
            -->
            <a href="mailto:josue_santos@icloud.com" class="email" title="E-mail" aria-label="E-mail">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>

        <!-- Lista de descrições / links -->
        <div class="links-list">
            <!-- EDITE AQUI: troque "" pelos links reais -->
            <a href="https://www.instagram.com/bandareprise" class="link-item" target="_blank" rel="noopener">
                <i class="fa-solid fa-music"></i>
                Músico Trompetista · @bandareprise
            </a>
            <a href="#" class="link-item" target="blank" rel="noopener">
                <i class="fa-solid fa-chalkboard-user"></i>
                Professor alfabetizador
            </a>
            <a href="https://www.instagram.com/p/DA_jr3HpUZ2/" class="link-item" target="blank" rel="noopener">
                <i class="fa-solid fa-palette"></i>
                Arte educador
            </a>
            <a href="#" class="link-item" target="blank" rel="noopener">
                <i class="fa-solid fa-laptop-code"></i>
                Viciado em tecnologia
            </a>
            <a href="https://www.instagram.com/p/BWghW8MjgXm/" class="link-item" target="_blank" rel="noopener">
                <i class="fa-solid fa-plane"></i>
                Amo viajar
            </a>
        </div>

        <!-- Botão de compartilhar -->
        <button class="share-button" onclick="compartilhar()">
            <i class="fa-solid fa-share-nodes"></i>
            Compartilhar cartão
        </button>
    </div>

    <script>
        function compartilhar() {
            const dados = {
                title: 'Josué Santos 🎺',
                text: 'Confira o cartão digital de Josué Santos — Trompetista e Educador.',
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(dados).catch(() => {});
            } else {
                // Fallback: copia o link
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert('Link copiado! Cole onde quiser compartilhar. 🎺'))
                    .catch(() => prompt('Copie o link abaixo:', window.location.href));
            }
        }
    </script>

</body>
</html>
