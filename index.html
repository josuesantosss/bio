<head>

    <meta name="author" content="Josué Santos">
    <meta name="theme-color" content="#f5f5f7">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Josué Santos 🎺 | Trompetista e Educador">
    <meta property="og:description" content="Músico, professor e arte educador. Agende uma apresentação ou aula!">
    <meta property="og:image" content="https://seusite.com/josue.jpeg">
    <meta property="og:url" content="https://seusite.com">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>">

    <!-- Fontes e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dourado: #d4af37;
            --dourado-brilho: #f0d060;
            --texto: #2c2c2c;
            --texto-suave: #4a4a4a;
            --card: rgba(255, 255, 255, 0.9);
            --card-hover: #ffffff;
            --sombra-suave: 0 8px 30px rgba(0, 0, 0, 0.06);
            --sombra-hover: 0 20px 45px rgba(212, 175, 55, 0.25);
            --transicao-suave: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f2f4f8 0%, #e4e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--texto);
            padding: 30px 15px;
            background-attachment: fixed;
            perspective: 1200px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--texto);
            letter-spacing: 2px;
            margin-bottom: 22px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--dourado);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        h1:hover::after {
            width: 120px;
        }

        /* Foto de perfil com anel animado tridimensional */
        .profile-pic-container {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 15px;
            border: 4px solid var(--dourado);
            padding: 5px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            transition: var(--transicao-suave);
            position: relative;
        }

        .profile-pic-container:hover {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.5);
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            transition: transform 0.6s ease;
        }

        .profile-pic-container:hover img {
            transform: scale(1.1);
        }

        /* Anel giratório */
        .profile-pic-container::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%;
            border: 2px dashed var(--dourado);
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: spin 10s linear infinite;
        }

        .profile-pic-container:hover::before {
            opacity: 0.8;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .username {
            font-size: 0.95rem;
            color: var(--texto-suave);
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* CTA Principal (WhatsApp) estilo pílula moderna */
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            border-radius: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.35);
            transition: var(--transicao-suave);
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .cta-button:hover::after {
            transform: translateX(100%);
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 32px rgba(37, 211, 102, 0.5);
        }

        .cta-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Redes Sociais */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.35rem;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: var(--transicao-suave);
            position: relative;
        }

        .social-icons a:hover {
            transform: translateY(-6px) rotate(12deg) scale(1.15);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
            background: var(--dourado);
            color: #fff !important;
        }

        .whatsapp { color: #25d366; }
        .instagram { color: #e1306c; }
        .facebook { color: #1877f2; }
        .email { color: #333; }
        .youtube { color: #ff0000; }

        /* Lista de Links (Cards Modernos / Bento style) */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
            perspective: 1000px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 22px;
            padding: 16px 22px;
            text-decoration: none;
            color: var(--texto);
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: var(--sombra-suave);
            transition: var(--transicao-suave);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Efeito de brilho deslizante ao passar o mouse */
        .link-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: var(--card-hover);
            transform: translateY(-5px) rotateX(4deg) rotateY(-3deg) scale(1.02);
            box-shadow: var(--sombra-hover);
            border-color: var(--dourado);
        }

        .link-item:active {
            transform: translateY(0) rotateX(0) rotateY(0) scale(0.97);
            transition: transform 0.1s ease;
        }

        /* Ícones dentro dos cards com animação especial */
        .link-item i {
            font-size: 1.25rem;
            color: var(--dourado);
            width: 28px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
        }

        .link-item:hover i {
            transform: scale(1.3) rotate(-15deg);
            color: #b08d20;
        }

        /* Botão de Compartilhar */
        .share-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 2px solid #d1d5db;
            color: var(--texto-suave);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 26px;
            border-radius: 28px;
            cursor: pointer;
            transition: var(--transicao-suave);
            position: relative;
            overflow: hidden;
        }

        .share-button:hover {
            background: #fff;
            border-color: var(--dourado);
            color: var(--dourado);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
        }

        .share-button:active {
            transform: translateY(0) scale(0.96);
        }

        .share-button i {
            transition: transform 0.4s ease;
        }

        .share-button:hover i {
            transform: rotate(25deg) scale(1.2);
        }

        /* Modo Escuro Automático */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #121215 0%, #1a1a1f 100%);
                color: #f3f4f6;
            }
            h1 { color: #ffffff; }
            .username { color: #9ca3af; }
            .profile-pic-container { background: #1f1f24; }
            .link-item {
                background: rgba(255, 255, 255, 0.05);
                color: #f3f4f6;
                border-color: rgba(212, 175, 55, 0.15);
            }
            .link-item:hover { 
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--dourado);
            }
            .social-icons a { background: #1f1f24; color: #fff; }
            .social-icons a:hover { background: var(--dourado); color: #fff !important; }
            .email { color: #f3f4f6; }
            .share-button { border-color: #4b5563; color: #d1d5db; }
            .share-button:hover { background: #1f1f24; color: var(--dourado); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 420px) {
            .container { padding: 20px 10px; }
            h1 { font-size: 1.4rem; }
            .profile-pic-container { width: 140px; height: 140px; }
            .social-icons a { width: 44px; height: 44px; font-size: 1.15rem; }
            .link-item { padding: 14px 18px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

        <!-- Botão de compartilhar -->
        <button class="share-button" onclick="compartilhar()">

    <script>
        function compartilhar() {
            const dados = {
                title: 'Josué Santos 🎺',
                text: 'Confira o cartão digital de Josué Santos — Trompetista e Educador.',
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(dados).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert('Link copiado! Cole onde quiser compartilhar. 🎺'))
                    .catch(() => prompt('Copie o link abaixo:', window.location.href));
            }
        }
    </script>

</body>
</html>
